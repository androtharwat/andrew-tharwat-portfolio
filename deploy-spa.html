<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081c2b"><meta name="description" content="Andrew Tharwat — Safety × Creativity × Technology"><title>Andrew Tharwat</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>:root{
  --red:#e10613;
  --red2:#ff3043;
  --navy:#0e2f46;
  --deep:#06131e;
  --ink:#081c2b;
  --soft:#f7f9fb;
  --text:#102637;
  --muted:#6b7c88;
  --light:#dfe7ec;
  --line:rgba(255,255,255,.12);
  --shadow:0 28px 60px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Montserrat,Arial,sans-serif;background:var(--deep);color:#fff;overflow-x:hidden}
a{color:inherit}
img{display:block;max-width:100%}
.noise{position:fixed;inset:0;pointer-events:none;opacity:.025;z-index:20;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E")}
.container{width:min(1200px,92%);margin:auto}
.site-header{position:fixed;inset:0 0 auto 0;height:78px;z-index:40;padding:0 3.2%;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;background:linear-gradient(180deg,rgba(4,16,26,.96),rgba(4,16,26,.68),transparent);backdrop-filter:blur(12px);transition:.3s}
.site-header.scrolled{height:66px;background:rgba(4,16,26,.94);border-bottom:1px solid rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;min-width:0}
.brand img{width:50px;height:50px;object-fit:contain}
.brand-copy{display:flex;flex-direction:column}
.brand-copy strong{font-size:14px;letter-spacing:1.8px;white-space:nowrap}
.brand-copy span{font-size:8px;letter-spacing:2.2px;color:#b8c5ce;margin-top:4px}
.main-nav{display:flex;justify-content:center;gap:22px}
.main-nav a,.footer-grid a{text-decoration:none;font-size:11px;color:#dce4ea;transition:.2s}
.main-nav a:hover,.main-nav a.active{color:#fff}
.main-nav a.active{position:relative}
.main-nav a.active:after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:2px;background:var(--red)}
.header-cta{padding:12px 18px;border-radius:9px;background:linear-gradient(135deg,var(--red),#ff3746);color:#fff;text-decoration:none;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 12px 30px rgba(225,6,19,.28)}
.menu-btn{display:none;background:none;border:0;padding:0;width:42px;height:42px;position:relative}
.menu-btn span{position:absolute;left:9px;right:9px;height:2px;background:#fff;border-radius:99px;transition:.2s}
.menu-btn span:first-child{top:15px}.menu-btn span:last-child{bottom:15px}
.hero{position:relative;min-height:760px;padding-top:108px;overflow:hidden;background:radial-gradient(circle at 80% 12%,rgba(34,96,140,.6),transparent 26%),radial-gradient(circle at 10% 70%,rgba(225,6,19,.14),transparent 20%),linear-gradient(135deg,#03111b 0%,#0a273b 56%,#071420 100%)}
.hero-grid{position:absolute;inset:0;opacity:.12;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to right,transparent,black 18%,black 82%,transparent)}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:180px;background:linear-gradient(0deg,#f7f9fb,transparent)}
.hero-blur{position:absolute;border-radius:50%;filter:blur(72px);opacity:.55}
.hero-blur-a{width:340px;height:340px;background:rgba(225,6,19,.22);left:-60px;top:140px}
.hero-blur-b{width:420px;height:420px;background:rgba(35,109,160,.24);right:0;top:40px}
.hero-layout{position:relative;z-index:2;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:34px;min-height:610px}
.eyebrow,.section-kicker{font-size:10px;letter-spacing:2px;font-weight:700}
.eyebrow{color:#d6dfe5}
.hero h1{font-size:clamp(42px,5.2vw,76px);line-height:.97;letter-spacing:-2px;margin:18px 0;max-width:700px}
.hero h1 span{display:block;color:#ff2635}
.hero p{max-width:620px;color:#d4dee5;font-size:15px;line-height:1.72;margin:0}
.hero-actions{display:flex;gap:14px;margin-top:28px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;padding:15px 19px;border-radius:8px;font-size:11px;font-weight:800;letter-spacing:.3px}
.btn-primary{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;box-shadow:0 12px 35px rgba(225,6,19,.28)}
.btn-ghost{border:1px solid rgba(255,255,255,.34);background:rgba(255,255,255,.03);color:#fff}
.btn.small{padding:12px 16px;font-size:10px}
.play{width:24px;height:24px;border:1px solid var(--red);border-radius:50%;display:grid;place-items:center;color:var(--red);font-size:9px}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:34px;max-width:650px}
.hero-stats div{padding-top:10px;border-top:1px solid var(--line)}
.hero-stats strong{display:block;font-size:34px;line-height:1;color:#fff}
.hero-stats span{display:block;margin-top:8px;font-size:10px;letter-spacing:1px;color:#b6c5cf;text-transform:uppercase;line-height:1.5}
.hero-visual{position:relative;display:flex;justify-content:flex-end}
.hero-visual img{width:min(560px,100%);border-radius:26px;border:1px solid rgba(255,255,255,.14);box-shadow:var(--shadow)}
.hero-sidecopy{position:absolute;right:2.2%;top:132px;text-align:right;color:#95aab8;font-size:9px;line-height:1.85;letter-spacing:2px;z-index:2}
.hero-sidecopy b{color:#ecf2f5}
.about-strip,.solutions-strip,.process-section{background:var(--soft);color:var(--text)}
.about-strip{padding:68px 0 56px}
.split-heading,.section-head{display:grid;grid-template-columns:1fr .72fr;gap:38px;align-items:end}
.split-heading.slim{align-items:center}
.split-heading h2,.section-head h2,.process-section h2,.cta-section h2{margin:0;font-size:clamp(30px,3.4vw,52px);line-height:1.02;letter-spacing:-1.3px;color:var(--text)}
.split-heading h2 b,.section-head h2 b,.process-section h2 b,.cta-section h2 b{color:var(--red)}
.split-heading p,.section-head p{font-size:13px;line-height:1.75;color:var(--muted);max-width:520px;margin:0}
.section-head.compact p{justify-self:end;text-align:right}
.section-kicker{color:var(--red);display:inline-block;margin-bottom:12px}
.section-kicker.light{color:#dce6ec}
.section-kicker:before{content:"";display:inline-block;width:26px;height:2px;background:currentColor;vertical-align:middle;margin-right:10px}
.expertise-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:42px}
.expertise-card{background:#fff;border:1px solid #e4eaee;border-radius:16px;padding:26px 16px;text-align:center;box-shadow:0 10px 24px rgba(8,28,43,.04)}
.expertise-card .icon{width:56px;height:56px;margin:0 auto 16px;border-radius:16px;border:2px solid #dce6ec;color:var(--red);display:grid;place-items:center;font-size:24px;font-weight:800}
.expertise-card h3{font-size:13px;letter-spacing:1px;margin:0 0 8px;color:var(--text)}
.expertise-card p{margin:0;color:var(--muted);font-size:10px;line-height:1.6;text-transform:uppercase;letter-spacing:.5px}
.worlds-section,.featured-section,.explore-section{color:#fff;background:#071a29}
.worlds-section{padding:70px 0 76px;background:radial-gradient(circle at 82% 0%,rgba(225,6,19,.08),transparent 22%),linear-gradient(180deg,#061722,#082234)}
.featured-section{padding:70px 0 80px;background:radial-gradient(circle at 12% 0%,rgba(225,6,19,.08),transparent 24%),#061722}
.explore-section{padding:70px 0 82px;background:linear-gradient(180deg,#071a29,#08131f)}
.section-actions{display:flex;flex-direction:column;align-items:flex-end;gap:18px}
.image-grid{display:grid;gap:14px;margin-top:28px}
.image-grid-4{grid-template-columns:repeat(4,1fr)}
.image-grid-5{grid-template-columns:repeat(5,1fr)}
.image-card,.wide-image-card{display:block;overflow:hidden;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:#0b2436;box-shadow:var(--shadow);transition:transform .28s,border-color .28s,box-shadow .28s}
.image-card:hover,.wide-image-card:hover{transform:translateY(-8px);border-color:rgba(255,255,255,.28);box-shadow:0 28px 66px rgba(0,0,0,.36)}
.image-card img,.wide-image-card img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.image-card:hover img,.wide-image-card:hover img{transform:scale(1.03)}
.solutions-strip{padding:66px 0 70px}
.flow-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:32px}
.flow-card{background:#fff;border:1px solid #e2e8ed;border-radius:14px;padding:18px 15px;min-height:118px;box-shadow:0 12px 24px rgba(8,28,43,.04)}
.flow-card span{color:var(--red);font-size:22px;display:block}
.flow-card p{font-size:10px;margin:14px 0 6px;color:var(--muted)}
.flow-card b{font-size:10px;color:var(--text)}
.focus-image-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px}
.wide-image-card{min-height:128px}
.process-section{padding:72px 0 80px}
.process-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:28px}
.process-grid article{background:#fff;border:1px solid #e2e8ed;border-radius:18px;padding:26px;box-shadow:0 14px 26px rgba(8,28,43,.05)}
.process-grid strong{font-size:32px;color:var(--red);display:block;margin-bottom:12px}
.process-grid h3{margin:0 0 10px;font-size:18px;color:var(--text)}
.process-grid p{margin:0;font-size:12px;line-height:1.8;color:var(--muted)}
.cta-section{position:relative;background:#f7f9fb;color:var(--text);overflow:hidden}
.cta-bg{position:absolute;inset:0;opacity:.26}
.cta-bg img{width:100%;height:100%;object-fit:cover}
.cta-section:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(247,249,251,.72),rgba(247,249,251,.92))}
.cta-layout{position:relative;z-index:1;display:grid;grid-template-columns:.9fr 1.1fr .7fr;gap:28px;align-items:center;padding:64px 0}
.cta-middle p{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.8}
.contact-direct{display:flex;gap:12px;flex-wrap:wrap;margin:-5px 0 18px}.contact-direct a{font-size:10px;font-weight:700;text-decoration:none;color:#0b2436;border-bottom:1px solid rgba(11,36,54,.28);padding-bottom:2px}.contact-direct a:hover{color:var(--red);border-color:var(--red)}
.cta-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.socials{display:flex;gap:10px;flex-wrap:wrap}
.socials a{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;text-decoration:none;background:#0b2436;color:#fff;font-size:11px;font-weight:800;box-shadow:0 12px 22px rgba(8,28,43,.12)}
.signature{font-size:44px;font-family:"Brush Script MT",cursive;color:#0d2334;line-height:1.1}
.cta-right small{display:block;margin-top:8px;font-size:10px;letter-spacing:1.6px;color:#4d606d}
.site-footer{background:#071420;color:#c8d4dc;padding:18px 0 20px;border-top:1px solid rgba(255,255,255,.06)}
.footer-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px}
.footer-grid p{margin:0;font-size:11px;color:#b7c4cd}
.footer-grid p:last-child{text-align:right}
.footer-grid nav{display:flex;gap:14px;justify-content:center}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .65s ease,transform .65s ease}
.reveal.visible{opacity:1;transform:none}
.delay-1{transition-delay:.08s}.delay-2{transition-delay:.16s}.delay-3{transition-delay:.24s}.delay-4{transition-delay:.32s}

@media (max-width: 1100px){
  .image-grid-4{grid-template-columns:repeat(2,1fr)}
  .image-grid-5{grid-template-columns:repeat(3,1fr)}
  .expertise-grid{grid-template-columns:repeat(3,1fr)}
  .process-grid{grid-template-columns:repeat(2,1fr)}
  .hero-layout{grid-template-columns:1fr}
  .hero-visual{justify-content:center}
  .hero-sidecopy{display:none}
  .split-heading,.section-head,.cta-layout{grid-template-columns:1fr}
  .section-actions,.section-head.compact p{text-align:left;align-items:flex-start;justify-self:start}
}
@media (max-width: 820px){
  .site-header{grid-template-columns:auto auto auto;gap:14px}
  .brand-copy span{display:none}
  .menu-btn{display:block;justify-self:center}
  .main-nav{position:fixed;inset:74px 14px auto 14px;background:rgba(4,16,26,.98);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:18px;display:grid;gap:14px;transform:scale(.96);opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--shadow)}
  .main-nav.open{opacity:1;transform:none;pointer-events:auto}
  .header-cta{padding:11px 14px;font-size:10px}
  .hero{min-height:auto;padding-bottom:34px}
  .hero h1{font-size:clamp(36px,9vw,52px)}
  .hero-stats{grid-template-columns:repeat(2,1fr)}
  .expertise-grid{grid-template-columns:repeat(2,1fr)}
  .flow-row{grid-template-columns:repeat(2,1fr)}
  .image-grid-4,.image-grid-5,.focus-image-grid{grid-template-columns:1fr}
  .cta-layout{padding:56px 0}
}
@media (max-width: 560px){
  .brand-copy strong{font-size:11px}
  .header-cta{display:none}
  .hero{padding-top:88px}
  .hero p{font-size:14px}
  .hero-stats strong{font-size:26px}
  .expertise-grid,.flow-row,.process-grid{grid-template-columns:1fr}
  .expertise-card,.flow-card,.process-grid article{padding-left:18px;padding-right:18px}
  .site-footer{padding-bottom:28px}
  .footer-grid{grid-template-columns:1fr;justify-items:start}
  .footer-grid p:last-child{text-align:left}
  .footer-grid nav{justify-content:flex-start;flex-wrap:wrap}
}
